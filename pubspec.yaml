name: bloc_dependency_manager
description: This is a package that helps manage Bloc and Cubit dependencies. It
  is based on the Bloc package and utilizes the Observer design pattern to
  manage dependencies.

version: 1.11.0

homepage: https://github.com/hamed-rezaee
repository: https://github.com/hamed-rezaee/bloc_dependency_manager
issue_tracker: https://github.com/hamed-rezaee/bloc_dependency_manager/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  bloc: ^9.0.1
  get_it: ^8.2.0

dev_dependencies:
  bloc_test: ^10.0.0
  test: ^1.26.3
  very_good_analysis: ^10.0.0
